version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: post_generate_ai_backend
    volumes:
      # Koddaki değişikliklerin anında (hot-reload) yansıması için klasörü map ediyoruz
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: post_generate_ai_frontend
    volumes:
      # Kod değişikliklerinin anında yansıması (hot-reload) için
      - ./frontend:/app
      # Kendi bilgisayarımızdaki (eğer varsa) node_modules klasörünün Docker içindekini ezmesini engelliyoruz
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    depends_on:
      - backend
